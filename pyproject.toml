[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_toolkit"
version = "0.1.0"
description = "From-scratch implementations of classical ML algorithms for CMOR 438 / INDE 577."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Junyi Huang", email = "jh328@rice.edu" }
]
keywords = ["machine learning", "education", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]
examples = [
    "jupyter",
    "matplotlib",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_toolkit*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Sensible defaults; nothing project-specific.
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # let formatter handle line length
